[settings]
# プロジェクトの .node-version / .nvmrc も読む
idiomatic_version_file_enable_tools = ["node"]

# グローバルには「どのディレクトリでも使うツール」だけを置く。
# プロジェクト専用のツールは各リポジトリの .mise.toml で固定する
#   - skaffold / helm: k8s-infrastructure（minikube はクラスタ操作でどこからでも使うのでグローバルにも置く）
#   - gauge: task-canvas-e2e
#   - terraform 1.15 系: aws-infrastructure
[tools]
node = "26"
python = "3.15.2"
go = "1.27.4"
ruby = "4.0.10"
dart = "3.14.1"
terraform = "1.17.2"
tflint = "0.66.0"
minikube = "1.39.0"
fzf = "0.75.0"
"pipx:poetry" = "2.5.2"
"npm:firebase-tools" = "15.37.0"
